name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            extras: test,image
          - os: ubuntu-latest
            python-version: '3.11'
            extras: test,image
          - os: ubuntu-latest
            python-version: '3.12'
            extras: test,image
          - os: ubuntu-latest
            python-version: '3.13'
            extras: test,image
          - os: macos-latest
            python-version: '3.14'
            extras: test
          - os: windows-latest
            python-version: '3.14'
            extras: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build ETE4 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "HOME=$env:USERPROFILE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $url = 'https://files.pythonhosted.org/packages/fa/53/0ceedd63e4c872f668188a5de786a00b6b8854cb285a3dc69cd107c62038/ete4-4.4.0.tar.gz'
          $expected = '0306ab66c2a1685946f94a4912718a5812dfc3059070300fc25d0e2b881bb8d1'
          Invoke-WebRequest -Uri $url -OutFile ete4-4.4.0.tar.gz
          $actual = (Get-FileHash -Algorithm SHA256 ete4-4.4.0.tar.gz).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ETE4 source checksum mismatch: $actual"
          }
          New-Item -ItemType Directory -Path ete4-source | Out-Null
          tar -xzf ete4-4.4.0.tar.gz -C ete4-source
          $setupPath = 'ete4-source/ete4-4.4.0/setup.py'
          $setupSource = Get-Content -Raw $setupPath
          $setupSource = $setupSource.Replace(
            "name = path.replace('/', '.')[:-len('.pyx')]",
            "name = path.replace('\\', '/').replace('/', '.')[:-len('.pyx')]"
          )
          Set-Content -NoNewline -Path $setupPath -Value $setupSource
          python -m pip install ./ete4-source/ete4-4.4.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python tools/check.py test

  macos-clean-install:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install from a clean environment
        run: |
          python -m pip install --upgrade pip
          pip install '.[test,image]'

      - name: Verify ETE and drawing on macOS
        run: |
          python -c 'from ete4 import Tree; assert len(list(Tree("(A:1,B:1);", parser=1).leaves())) == 2'
          pytest tests/test_draw.py tests/test_draw_robustness.py -q

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install quality and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[dev,image]'

      - name: Run full source checks
        run: python tools/check.py full

      - name: Require coverage for changed lines
        if: github.event_name == 'pull_request'
        run: |
          python -m coverage xml
          diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=80

      - name: Build and inspect distributions
        run: python tools/check.py dist

      - name: Test the source distribution in a clean tree
        run: |
          SDIST_TEST_DIR="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "${SDIST_TEST_DIR}"
          cd "${SDIST_TEST_DIR}"/nwkit-*
          pytest tests/test_cli.py tests/test_wiki_examples.py -q \
            --durations=10 --durations-min=0.05

      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          nwkit --version
          printf '(A:1,B:1);' | nwkit validate --fail-on-issue yes > /dev/null
          printf '(A:1,B:1);' | nwkit info > /dev/null
          printf '(A:1,B:1);' | nwkit nwk2table | nwkit table2nwk > /dev/null
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="blue"/></svg>\n' > /tmp/nwkit-tip.svg
          printf 'leaf_name\tlocal_path\nA\t/tmp/nwkit-tip.svg\n' > /tmp/nwkit-manifest.tsv
          printf '(A:1,B:1);' | nwkit draw --species-overlap-node-plot no --tip-image-manifest /tmp/nwkit-manifest.tsv -o /tmp/nwkit-smoke.svg
          test -s /tmp/nwkit-smoke.svg
