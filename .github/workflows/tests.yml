name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'studies' || 'regressions' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_checks: ${{ steps.scope.outputs.source_checks }}
      macos_clean: ${{ steps.scope.outputs.macos_clean }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select required coverage
        id: scope
        run: python tools/ci_matrix.py
      - name: Set up Python for documentation/package checks
        if: steps.scope.outputs.source_checks != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Validate documentation distributions
        if: steps.scope.outputs.source_checks != 'true'
        run: |
          python -m pip install -c constraints-dev.txt build twine check-wheel-contents
          python tools/check.py dist

  test:
    needs: scope
    if: needs.scope.outputs.source_checks == 'true'
    runs-on: ${{ matrix.os }}
    # Replicated studies run separately; retain the regression job's existing budget.
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      NWKIT_CI_DIAGNOSTICS: '1'
      PYTHONUNBUFFERED: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache the verified ETE4 Windows wheel
        if: runner.os == 'Windows'
        id: ete-wheel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ete-wheel-cache
          key: ete4-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('tools/build_ete_windows.py') }}

      - name: Build ETE4 on Windows
        if: runner.os == 'Windows' && steps.ete-wheel.outputs.cache-hit != 'true'
        run: python tools/build_ete_windows.py ete-wheel-cache

      - name: Install ETE4 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "HOME=$env:USERPROFILE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $wheel = (Get-ChildItem ete-wheel-cache/ete4-*.whl).FullName
          python -m pip install $wheel

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: |
          python tools/ci_diagnostics.py
          python tools/check.py test

  scientific-studies:
    needs: scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install study dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[test]'

      - name: Run replicated scientific studies once without coverage
        run: |
          python tools/ci_diagnostics.py
          python tools/check.py test -- --run-studies -m study -s -rs \
            --basetemp="${{ runner.temp }}/nwkit-scientific-studies"

      - name: Retain study protocols, bootstrap statistics and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-study-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nwkit-scientific-studies/**/*.json
          retention-days: 14

  macos-clean-install:
    needs: scope
    if: needs.scope.outputs.macos_clean == 'true'
    timeout-minutes: 20
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install from a clean environment
        run: |
          python -m pip install --upgrade pip
          pip install '.[test,image]'

      - name: Verify ETE and drawing on macOS
        run: |
          python -c 'from ete4 import Tree; assert len(list(Tree("(A:1,B:1);", parser=1).leaves())) == 2'
          pytest tests/test_draw.py tests/test_draw_robustness.py -q

  quality:
    needs: scope
    if: needs.scope.outputs.source_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NWKIT_CI_DIAGNOSTICS: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install quality and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[dev,image]'

      - name: Run full source checks
        run: |
          python tools/ci_diagnostics.py
          python tools/check.py full

      - name: Require coverage for changed lines
        if: github.event_name == 'pull_request'
        run: |
          python -m coverage xml
          diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=80

      - name: Build and inspect distributions
        run: python tools/check.py dist

      - name: Test the source distribution in a clean tree
        run: |
          SDIST_TEST_DIR="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "${SDIST_TEST_DIR}"
          cd "${SDIST_TEST_DIR}"/nwkit-*
          pytest tests/test_cli.py tests/test_cli_contracts.py tests/test_interface_conventions.py -q \
            --durations=10 --durations-min=0.05

      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          nwkit --version
          printf '(A:1,B:1);' | nwkit validate --fail-on-issue yes > /dev/null
          printf '(A:1,B:1);' | nwkit info > /dev/null
          printf '(A:1,B:1);' | nwkit nwk2table | nwkit table2nwk > /dev/null
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="blue"/></svg>\n' > /tmp/nwkit-tip.svg
          printf 'leaf_name\tlocal_path\nA\t/tmp/nwkit-tip.svg\n' > /tmp/nwkit-manifest.tsv
          printf '(A:1,B:1);' | nwkit draw --species-overlap-node-plot no --tip-image-manifest /tmp/nwkit-manifest.tsv -o /tmp/nwkit-smoke.svg
          test -s /tmp/nwkit-smoke.svg
