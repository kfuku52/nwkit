name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Verify tag matches package version
        run: |
          VERSION="$(python -c 'from nwkit import __version__; print(__version__)')"
          test "v${VERSION}" = "${RELEASE_TAG}"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[dev,image]'

      - name: Verify source, tests, and distributions
        run: python tools/check.py release

      - name: Test the source distribution in a clean tree
        run: |
          SDIST_TEST_DIR="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "${SDIST_TEST_DIR}"
          cd "${SDIST_TEST_DIR}"/nwkit-*
          pytest tests/test_cli.py tests/test_cli_contracts.py tests/test_wiki_examples.py -q \
            --durations=10 --durations-min=0.05

      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          nwkit --version
          printf '(A:1,B:1);' | nwkit validate --fail-on-issue yes > /dev/null
          printf '(A:1,B:1);' | nwkit info > /dev/null
          printf '(A:1,B:1);' | nwkit nwk2table | nwkit table2nwk > /dev/null
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="blue"/></svg>\n' > /tmp/nwkit-tip.svg
          printf 'leaf_name\tlocal_path\nA\t/tmp/nwkit-tip.svg\n' > /tmp/nwkit-manifest.tsv
          printf '(A:1,B:1);' | nwkit draw --species-overlap-node-plot no --tip-image-manifest /tmp/nwkit-manifest.tsv -o /tmp/nwkit-smoke.svg
          test -s /tmp/nwkit-smoke.svg

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" dist/* --verify-tag --generate-notes --title "${RELEASE_TAG}"
          fi
