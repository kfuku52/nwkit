name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Verify tag matches package version
        run: |
          VERSION="$(python -c 'from nwkit import __version__; print(__version__)')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,image]'

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Verify source and tests
        run: |
          ruff check nwkit tests setup.py
          mypy --no-incremental
          python -m pip check
          bandit -r nwkit -ll -ii -q
          python -m pip_audit .
          pytest tests/ -q --durations=20 --durations-min=0.05

      - name: Build and inspect distributions
        run: |
          mkdir -p build/lib/nwkit
          printf 'raise RuntimeError("stale build artifact")\n' > build/lib/nwkit/_mad.py
          python -m build --wheel --outdir direct-dist
          python -m build
          cmp direct-dist/*.whl dist/*.whl
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          direct_wheel_path, = glob.glob('direct-dist/*.whl')
          wheel_path, = glob.glob('dist/*.whl')
          sdist_path, = glob.glob('dist/*.tar.gz')
          forbidden_suffixes = ('/nwkit/_mad.py', '/THIRD_PARTY_NOTICES')
          required_wheel = {
              'nwkit/__init__.py',
              'nwkit/root.py',
              'nwkit/data_tree/apgiv.nwk',
          }
          for candidate_wheel in (direct_wheel_path, wheel_path):
              with zipfile.ZipFile(candidate_wheel) as wheel:
                  wheel_members = set(wheel.namelist())
              assert required_wheel <= wheel_members
              assert not any(
                  member == 'nwkit/_mad.py'
                  or member == 'THIRD_PARTY_NOTICES'
                  or member.endswith('/THIRD_PARTY_NOTICES')
                  for member in wheel_members
              )
          with tarfile.open(sdist_path, 'r:gz') as sdist:
              sdist_members = set(sdist.getnames())
          assert all(
              any(member.endswith(suffix) for member in sdist_members)
              for suffix in (
                  '/nwkit/__init__.py',
                  '/nwkit/root.py',
                  '/nwkit/data_tree/apgiv.nwk',
                  '/setup.py',
              )
          )
          assert not any(
              member.endswith(forbidden_suffixes)
              for member in sdist_members
          )
          PY

      - name: Test the source distribution in a clean tree
        run: |
          SDIST_TEST_DIR="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "${SDIST_TEST_DIR}"
          cd "${SDIST_TEST_DIR}"/nwkit-*
          pytest tests/test_cli.py tests/test_wiki_examples.py -q \
            --durations=10 --durations-min=0.05

      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          nwkit --version
          printf '(A:1,B:1);' | nwkit validate --fail-on-issue yes > /dev/null
          printf '(A:1,B:1);' | nwkit info > /dev/null
          printf '(A:1,B:1);' | nwkit nwk2table | nwkit table2nwk > /dev/null
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="blue"/></svg>\n' > /tmp/nwkit-tip.svg
          printf 'leaf_name\tlocal_path\nA\t/tmp/nwkit-tip.svg\n' > /tmp/nwkit-manifest.tsv
          printf '(A:1,B:1);' | nwkit draw --species-overlap-node-plot no --tip-image-manifest /tmp/nwkit-manifest.tsv -o /tmp/nwkit-smoke.svg
          test -s /tmp/nwkit-smoke.svg

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
