[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nwkit"
dynamic = ["version"]
description = "Tools for processing Newick trees"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Kenji Fukushima", email = "kfuku52@gmail.com"},
]
keywords = ["phylogenetics", "newick", "tree"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "defusedxml>=0.7",
  "ete4>=4.4.0",
  "pandas",
  "requests>=2.32.2",
  "urllib3>=2",
  "numpy",
  "scipy",
  "matplotlib",
  "Pillow",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.165",
  "pytest>=7",
]
image = ["CairoSVG"]
dev = [
  "bandit>=1.9",
  "build>=1.3",
  "check-wheel-contents>=0.6",
  "coverage>=7.13",
  "diff-cover>=10.5",
  "hypothesis>=6.165",
  "mypy>=1.19",
  "pip-audit>=2.10",
  "pytest>=7",
  "radon>=6",
  "ruff>=0.15",
  "twine>=6",
]

[project.scripts]
nwkit = "nwkit.cli:main"

[project.urls]
Homepage = "https://github.com/kfuku52/nwkit"
Documentation = "https://github.com/kfuku52/nwkit/wiki"
Repository = "https://github.com/kfuku52/nwkit.git"
Issues = "https://github.com/kfuku52/nwkit/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "nwkit.__version__"}

[tool.setuptools.packages.find]
include = ["nwkit"]
namespaces = false

[tool.setuptools.package-data]
nwkit = ["data_tree/*.nwk"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["nwkit"]
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true

[[tool.mypy.overrides]]
module = ["nwkit.conventions", "nwkit.fasta"]
disallow_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["nwkit"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
xfail_strict = true
markers = [
  "integration: exercises a command or component boundary rather than one isolated unit",
  "slow: intentionally performs comparatively expensive concurrency or numerical work",
]
